<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Không tìm thấy trang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.14/dist/dotlottie-wc.js" type="module"></script>
</head>
<body class="bg-[#131314] text-white flex items-center justify-center min-h-screen">
    <div class="text-center flex flex-col items-center justify-center">
        <!-- 404 Cat Lottie -->
        <dotlottie-wc src="/icons/404-cat.lottie" style="width: 320px; height: 320px; max-width: 100%; margin-bottom: -10px;" autoplay loop></dotlottie-wc>
        
        <p class="text-xl mb-8 mt-2 text-gray-400 font-medium">Rất tiếc, không tìm thấy trang này!</p>
        <a href="/" class="px-8 py-3 bg-[#fcd576] text-black font-bold rounded-xl hover:bg-yellow-500 transition-all shadow-[0_4px_12px_rgba(252,213,118,0.3)] hover:-translate-y-1">
            Về trang chủ
        </a>
    </div>

<!-- A PHIM Floating Side Dock -->
<link rel="stylesheet" href="/css/floating-dock.css?v=5">

<div class="floating-dock-container" id="floatingDock">
    <!-- The Dock -->
    <div class="fd-dock" id="fdDockGroup">
        <!-- Collapsed Handle -->
        <div class="fd-handle" id="fdHandle" title="Mở rộng">
            <div class="fd-indicator"></div>
            <span class="material-icons-round">forum</span>
        </div>
        
        <!-- Expanded Menu -->
        <div class="fd-menu" id="fdMenu">
            <!-- Nút mở Chat cộng đồng -->
            <button class="fd-btn fd-btn-chat" id="fdBtnChat" title="Chat Cộng Đồng">
                <span class="material-icons-round">forum</span>
            </button>
            
            <!-- Nút mở Telegram -->
            <a href="https://t.me/aphim" target="_blank" rel="noopener noreferrer" class="fd-btn fd-btn-telegram" title="Kênh Telegram">
                <!-- Telegram SVG Icon -->
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.19-.08-.05-.19-.02-.27 0-.12.03-1.97 1.25-5.56 3.67-.52.36-.99.53-1.41.52-.46-.01-1.34-.26-2.01-.48-.82-.27-1.47-.42-1.42-.88.03-.24.29-.49.79-.75 3.09-1.35 5.16-2.24 6.21-2.68 2.95-1.25 3.56-1.47 3.96-1.47.09 0 .28.02.4.1.11.07.17.16.19.27.01.07.02.16.01.27z"/>
                </svg>
            </a>
            
            <!-- Nút Đóng -->
            <button class="fd-btn fd-btn-close" id="fdBtnClose" title="Thu gọn">
                <span class="material-icons-round">close</span>
            </button>
        </div>
    </div>
    
    <!-- Scroll To Top Button (Below Dock) -->
    <button class="fd-btn-top" id="fdBtnTop" aria-label="Lên đầu trang" title="Lên đầu trang">
        <span class="material-icons-round">keyboard_arrow_up</span>
    </button>
</div>

<script src="/js/floating-dock.js?v=1" defer></script>




<!-- ===== MOBILE SEARCH OVERLAY ===== -->
<div id="mobileSearchOverlay" style="opacity: 0; visibility: hidden; pointer-events: none;">
    <div class="mso-header">
        <div class="mso-input-wrap">
            <span class="material-icons-round mso-icon-search">search</span>
            <input type="text" id="msoInput" class="mso-input"
                placeholder="Tìm kiếm phim, diễn viên..." autocomplete="off" enterkeyhint="search">
            <button id="msoClearBtn" class="mso-clear-btn" aria-label="Xóa">
                <span class="material-icons-round" style="font-size:18px;">close</span>
            </button>
        </div>
        <button id="msoCloseBtn" class="mso-close-btn" aria-label="Đóng">
            <span class="material-icons-round">close</span>
        </button>
    </div>
    
    <div id="msoResultsArea" class="mso-results-area">
        <div id="msoResultsHeader" class="mso-results-header">
            <span>KẾT QUẢ TÌM KIẾM</span>
            <span id="msoResultsCount">0 phim</span>
        </div>
        <div id="msoResultsList" class="mso-results-list">
            <!-- Search results injected here -->
        </div>
        <a href="#" id="msoSeeAll" class="mso-see-all">Xem tất cả kết quả &gt;</a>
    </div>
</div>
<link rel="stylesheet" href="css/mobile-search-overlay.css?v=110">
<script src="js/mobile-search-overlay.js?v=111" defer></script>

</body>
</html>
